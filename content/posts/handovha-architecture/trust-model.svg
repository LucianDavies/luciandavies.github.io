<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" font-family="'SF Mono','Fira Code','Cascadia Code',monospace">
  <style>
    .box { fill:#1e1e2e; stroke:#89b4fa; stroke-width:1.5; }
    .box-open { fill:#1e1e2e; stroke:#a6e3a1; stroke-width:1.5; }
    .box-auth { fill:#1e1e2e; stroke:#f9e2af; stroke-width:1.5; }
    .label-c { fill:#cdd6f4; text-anchor:middle; font-size:12.5px; font-weight:bold; }
    .note { fill:#a6adc8; font-size:10.5px; text-anchor:middle; }
    .heading { fill:#f9e2af; font-size:14px; font-weight:bold; text-anchor:middle; }
    .arrow { stroke:#89b4fa; stroke-width:1.5; fill:none; marker-end:url(#a8); }
    .arrow-open { stroke:#a6e3a1; stroke-width:1.5; fill:none; marker-end:url(#a9); }
    .col { fill:#cdd6f4; text-anchor:middle; font-size:11.5px; font-weight:bold; }
  </style>
  <defs>
    <marker id="a8" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#89b4fa"/>
    </marker>
    <marker id="a9" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#a6e3a1"/>
    </marker>
  </defs>
  <rect width="800" height="360" fill="#181825" rx="12"/>
  <text x="400" y="28" class="heading">Two visibility rules, same predicate, checked twice</text>

  <!-- Identity column -->
  <text x="120" y="55" class="col">Identity</text>
  <rect x="30" y="65" width="180" height="60" rx="8" class="box"/>
  <text x="120" y="90" class="label-c">Email in</text>
  <text x="120" y="108" class="note">magic link, 15min TTL</text>
  <line x1="120" y1="125" x2="120" y2="155" class="arrow"/>
  <rect x="30" y="160" width="180" height="55" rx="8" class="box"/>
  <text x="120" y="184" class="label-c">Session cookie</text>
  <text x="120" y="200" class="note">no password, ever</text>

  <!-- Dashboard column -->
  <text x="370" y="55" class="col">Authenticated (creator or named party)</text>
  <rect x="250" y="65" width="240" height="150" rx="8" class="box-auth"/>
  <text x="370" y="95" class="label-c" fill="#f9e2af">GET /dashboard</text>
  <text x="370" y="115" class="note">created_by = me</text>
  <text x="370" y="132" class="note">OR (completed AND</text>
  <text x="370" y="148" class="note">from_email/to_email = me)</text>
  <line x1="370" y1="165" x2="370" y2="195" class="arrow"/>
  <text x="370" y="205" class="note">GET /files/:type/:id/*</text>
  <text x="370" y="219" class="note" font-size="9.5">same predicate — draft assets</text>
  <text x="370" y="231" class="note" font-size="9.5">never public</text>

  <line x1="210" y1="95" x2="248" y2="95" class="arrow"/>

  <!-- Public column -->
  <text x="650" y="55" class="col">Public — no auth (deliberate)</text>
  <rect x="540" y="65" width="220" height="120" rx="8" class="box-open"/>
  <text x="650" y="92" class="label-c" fill="#a6e3a1">GET /certificates/:id</text>
  <text x="650" y="112" class="note">status = 'completed' only</text>
  <text x="650" y="130" class="note">QR / link is the credential —</text>
  <text x="650" y="146" class="note">that's the whole point of</text>
  <text x="650" y="162" class="note">a verifiable certificate</text>

  <line x1="650" y1="185" x2="650" y2="215" class="arrow-open"/>
  <rect x="540" y="220" width="220" height="55" rx="8" class="box"/>
  <text x="650" y="244" class="label-c">robots.txt: Disallow</text>
  <text x="650" y="260" class="note">reachable ≠ indexable — names</text>

  <line x1="490" y1="140" x2="538" y2="120" class="arrow" stroke-dasharray="3 3"/>
  <text x="510" y="300" class="note" font-size="10">Certificate names + ID numbers stay out of the sitemap and crawl,</text>
  <text x="510" y="315" class="note" font-size="10">even though the route itself answers anyone holding the link.</text>
</svg>
